<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ねこマインスイーパー</title>
<style>
  :root { --bg: #fff5f8; --tile: #ffd1dc; --tile-hi: #ffe3ea; --open: #fffaf0; --ink: #6b4a57; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
         font-family: "Hiragino Maru Gothic ProN", "M PLUS Rounded 1c", sans-serif;
         display: flex; flex-direction: column; align-items: center; padding: 16px; box-sizing: border-box; }
  h1 { margin: 8px 0; font-size: 1.6rem; }
  .bar { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; justify-content: center; }
  button, select { font: inherit; color: inherit; border: 2px solid var(--tile); background: #fff; border-radius: 999px; padding: 4px 14px; cursor: pointer; }
  #face { font-size: 1.8rem; padding: 0 10px; }
  #board { display: grid; gap: 3px; background: #ffc2d1; padding: 8px; border-radius: 16px; touch-action: manipulation; }
  .cell { width: min(9vw, 34px); aspect-ratio: 1; border: 0; border-radius: 8px; padding: 0;
          background: var(--tile); box-shadow: inset 0 -3px #f4a6b8; font-size: min(5vw, 20px); font-weight: bold;
          -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
  .cell:hover:not(.open) { background: var(--tile-hi); }
  .cell.open { background: var(--open); box-shadow: none; cursor: default; }
  .n1 { color: #5fa8d3; } .n2 { color: #6cbf84; } .n3 { color: #e8798f; } .n4 { color: #9b7fd1; }
  .n5 { color: #d9935b; } .n6 { color: #4bb3a8; } .n7 { color: #555; } .n8 { color: #999; }
  #help { margin-bottom: 12px; max-width: 360px; }
  #help summary { display: block; width: fit-content; margin: 0 auto; border: 2px solid var(--tile); background: #fff; border-radius: 999px; padding: 4px 14px; cursor: pointer; list-style: none; }
  #help summary::-webkit-details-marker { display: none; }
  #help ul { background: #fff; border-radius: 12px; padding: 10px 10px 10px 28px; margin: 8px 0 0; line-height: 1.7; }
  #msg { min-height: 1.5em; margin-top: 12px; }
</style>
</head>
<body>
<h1>🐾 ねこマインスイーパー 🐾</h1>
<p>寝ている猫を起こさないように、全部のクッションをめくってね</p>
<div class="bar">
  <select id="level">
    <option value="9,9,10">こねこ</option>
    <option value="16,16,40">おとな猫</option>
    <option value="16,30,99">ボス猫</option>
  </select>
  <span id="left"></span>
  <button id="face" aria-label="リスタート">😺</button>
</div>
<details id="help">
  <summary>❓ 遊び方</summary>
  <ul>
    <li>クリック（タップ）でクッションをめくる</li>
    <li>数字は、まわり8マスで寝ている猫😴の数</li>
    <li>右クリック（スマホは長押し）で🐾の目印。もう一回で外れる</li>
    <li>猫のいないマスを全部めくったらクリア😻</li>
    <li>😺を押すと最初からやり直し</li>
  </ul>
</details>
<div id="board"></div>
<div id="msg"></div>
<script src="logic.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  let b, rows, cols, cats, over;

  function start() {
    [rows, cols, cats] = $('level').value.split(',').map(Number);
    b = null; over = false;
    $('face').textContent = '😺'; $('msg').textContent = '';
    $('board').style.gridTemplateColumns = `repeat(${cols}, auto)`;
    render();
  }

  function render() {
    const flags = b ? b.cells.flat().filter((c) => c.flag).length : 0;
    $('left').textContent = `😴 × ${cats - flags}`;
    $('board').replaceChildren(...Array.from({ length: rows * cols }, (_, i) => {
      const r = Math.floor(i / cols), c = i % cols, x = b?.cells[r][c];
      const el = document.createElement('button');
      el.className = 'cell';
      el.dataset.r = r; el.dataset.c = c;
      if (x?.open) {
        el.classList.add('open');
        el.textContent = x.cat ? '😾' : x.n || '';
        if (x.n && !x.cat) el.classList.add('n' + x.n);
      } else if (over && x?.cat) {
        el.textContent = x.flag ? '😽' : '😴';
      } else if (x?.flag) {
        el.textContent = '🐾';
      }
      return el;
    }));
  }

  function act(r, c, flag) {
    if (over) return;
    if (flag) { if (b) toggleFlag(b, r, c); return render(); }
    b ??= createBoard(rows, cols, cats, r, c);
    if (reveal(b, r, c) === 'boom') {
      over = true; $('face').textContent = '😿'; $('msg').textContent = '猫が起きちゃった…！もう一回？';
    } else if (isWon(b)) {
      over = true; $('face').textContent = '😻'; $('msg').textContent = 'みんなぐっすり！クリア🎉';
    }
    render();
  }

  const target = (e) => e.target.closest('.cell');
  let timer, longPressed = false, touch = false;
  $('board').addEventListener('pointerdown', (e) => {
    touch = e.pointerType === 'touch'; longPressed = false;
    const t = target(e);
    if (touch && t) timer = setTimeout(() => {
      longPressed = true; navigator.vibrate?.(30); act(+t.dataset.r, +t.dataset.c, true);
    }, 400);
  });
  for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) $('board').addEventListener(ev, () => clearTimeout(timer));
  $('board').addEventListener('click', (e) => {
    if (longPressed) return (longPressed = false);
    const t = target(e); if (t) act(+t.dataset.r, +t.dataset.c, false);
  });
  $('board').addEventListener('contextmenu', (e) => {
    const t = target(e); if (!t) return;
    e.preventDefault();
    if (!touch) act(+t.dataset.r, +t.dataset.c, true); // タッチの長押しは pointerdown 側で処理済み
  });
  $('face').onclick = start;
  $('level').onchange = start;
  start();
</script>
</body>
</html>
